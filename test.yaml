# OneUptime Minimal Homelab Configuration
# Optimized for 16GB RAM, 4 Core systems
# This includes only essential services for basic monitoring functionality
# ClickHouse, workers, and ingest services are excluded to save resources

x-env-file: &env_file
  - ./config.env

services:
  redis:
    env_file: *env_file
    extends:
      file: ./docker-compose.base.yml
      service: redis
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  clickhouse:
    env_file: *env_file
    extends:
      file: ./docker-compose.base.yml
      service: clickhouse
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G

  accounts:
    env_file: *env_file
    image: oneuptime/accounts:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: accounts
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
      ACCOUNTS_PORT: "3003"
      PORT: "3003"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

  dashboard:
    env_file: *env_file
    image: oneuptime/dashboard:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: dashboard
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
      DASHBOARD_PORT: "3009"
      PORT: "3009"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G

  status-page:
    env_file: *env_file
    image: oneuptime/status-page:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: status-page
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
      STATUS_PAGE_PORT: "3105"
      PORT: "3105"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  app:
    env_file: *env_file
    image: oneuptime/app:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: app
    entrypoint: sh -c "export NODE_OPTIONS='--max-old-space-size=2048 --no-warnings' && node --require ts-node/register Index.ts"
    environment:
      APP_PORT: "3002"
      PORT: "3002"
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 2G

  worker:
    env_file: *env_file
    image: oneuptime/worker:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: worker
    entrypoint: sh -c "export NODE_OPTIONS='--max-old-space-size=1100 --no-warnings' && node --require ts-node/register Index.ts"
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 900M

  workflow:
    env_file: *env_file
    image: oneuptime/workflow:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: workflow
    entrypoint: sh -c "export NODE_OPTIONS='--max-old-space-size=1100 --no-warnings' && node --require ts-node/register Index.ts"
    environment:
      NODE_OPTIONS: "--max-old-space-size=1100"
      WORKFLOW_PORT: "3099"
      PORT: "3099"
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 900M

  probe-1:
    env_file: *env_file
    image: oneuptime/probe:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-1

  probe-2:
    env_file: *env_file
    image: oneuptime/probe:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-2

  probe-ingest:
    env_file: *env_file
    image: oneuptime/probe-ingest:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-ingest

  # API Reference service disabled for homelab (too memory-intensive, 1GB+)
  # The /reference/* endpoints are optional API documentation
  # If needed in production, increase memory and uncomment below
  # api-reference:
  #     env_file: *env_file
  #     image: oneuptime/api-reference:${APP_TAG}
  #     extends:
  #         file: ./docker-compose.base.yml
  #         service: api-reference
  #     entrypoint: sh -c "export NODE_OPTIONS='--max-old-space-size=1100 --no-warnings' && node --require ts-node/register Index.ts"
  #     environment:
  #         API_REFERENCE_PORT: "3001"
  #         PORT: "3001"
  #     deploy:
  #         resources:
  #             limits:
  #                 memory: 1G
  #             reservations:
  #                 memory: 768M

  ingress:
    env_file: *env_file
    image: oneuptime/nginx:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ingress
    ports: !reset
      - "127.0.0.1:8081:7849"
      - "127.0.0.1:8443:7850"
    environment:
      # Main services - these must use service names for DNS resolution
      SERVER_ACCOUNTS_HOSTNAME: "accounts"
      ACCOUNTS_PORT: "3003"
      SERVER_APP_HOSTNAME: "app"
      APP_PORT: "3002"
      SERVER_DASHBOARD_HOSTNAME: "dashboard"
      DASHBOARD_PORT: "3009"
      SERVER_STATUS_PAGE_HOSTNAME: "status-page"
      STATUS_PAGE_PORT: "3105"
      # API Reference service - DISABLED for homelab (too memory intensive)
      # Maps to non-existent service so it returns connection refused
      SERVER_API_REFERENCE_HOSTNAME: "127.0.0.1"
      API_REFERENCE_PORT: "3001"
      # Ingest services
      SERVER_PROBE_INGEST_HOSTNAME: "probe-ingest"
      PROBE_INGEST_PORT: "3400"
      SERVER_SERVER_MONITOR_INGEST_HOSTNAME: "127.0.0.1"
      SERVER_MONITOR_INGEST_PORT: "3402"
      SERVER_TELEMETRY_HOSTNAME: "127.0.0.1"
      TELEMETRY_PORT: "3403"
      SERVER_INCOMING_REQUEST_INGEST_HOSTNAME: "127.0.0.1"
      INCOMING_REQUEST_INGEST_PORT: "3404"
      # Optional services - redirect to localhost
      SERVER_ADMIN_DASHBOARD_HOSTNAME: "127.0.0.1"
      ADMIN_DASHBOARD_PORT: "3158"
      SERVER_ISOLATED_VM_HOSTNAME: "127.0.0.1"
      ISOLATED_VM_PORT: "3151"
      SERVER_WORKER_HOSTNAME: "127.0.0.1"
      WORKER_PORT: "3004"
      SERVER_WORKFLOW_HOSTNAME: "workflow"
      WORKFLOW_PORT: "3099"
      SERVER_DOCS_HOSTNAME: "127.0.0.1"
      DOCS_PORT: "3159"
      SERVER_HOME_HOSTNAME: "127.0.0.1"
      HOME_PORT: "3105"
      SERVER_OTEL_COLLECTOR_HOSTNAME: "127.0.0.1"
      SERVER_MCP_HOSTNAME: "127.0.0.1"
      MCP_PORT: "3160"
      # Fix NGINX_LISTEN_ADDRESS - needs colon separator
      NGINX_LISTEN_ADDRESS: "0.0.0.0:"
      BILLING_ENABLED: "false"
      HOST: "10.10.1.15"
      # Reduce memory footprint
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      - accounts
      - app
      - dashboard
      - status-page
      - workflow
      - probe-ingest
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G

  caddy:
    image: caddy:2-alpine
    container_name: oneuptime-caddy
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - oneuptime
    depends_on:
      - ingress
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  log-router:
    image: fluent/fluent-bit:3.0.0
    container_name: oneuptime-log-router
    ports:
      - "127.0.0.1:24224:24224"
    volumes:
      - /home/landa/oneuptime-data/logs:/logs
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 50M

volumes:
  postgres:
  clickhouse:
  caddy_data:
  caddy_config:

networks:
  oneuptime:
    driver: bridge
